<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lipi Converter</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js"></script>
  </head>

  <body>
    <nav>
      <div id="app-title" class="newa-font text-center">
        <h2>𑐣𑐾𑐥𑐵𑐮 𑐮𑐶𑐥𑐶 𑐎𑐣𑑂𑐨𑐬𑑂𑐚𑐬</h2>
        <p>NEPAL LIPI CONVERTER</p>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row" id="content">
        <div class="col-md-6 mb-5">
          <h6 class="text-white text-center">Devanagari</h6>
            <label for="deva-text"></label><textarea
            class="center-content"
            name="deva-text"
            id="deva-text"
            rows="10"
            placeholder="Type Here / थन देवनागरी लिपिंइ च्वयादिसं"
          ></textarea>
            <button id="btn-copy-deva" class="btn btn-dark mt-2" style="display: none;" onclick="copyDevanagari()">Copy Devanagari Text</button>
        </div>
        <div class="col-md-6">
          <h6 class="text-white text-center">Nepal Lipi (Noto Sans Newa)</h6>
            <label for="newa-text"></label><textarea
            class="center-content"
            name="newa-text"
            id="newa-text"
            rows="10"
            placeholder="Type Here / 𑐠𑐣 𑐣𑐾𑐥𑐵𑐮 𑐮𑐶𑐥𑐶𑑄𑐂 𑐔𑑂𑐰𑐫𑐵𑐡𑐶𑐳𑑄"
          ></textarea>
            <button id="btn-copy-newa" class="btn btn-dark mt-2" style="display: none;" onclick="copyNewa()">Copy Newa Text</button>
        </div>
      </div>
    </div>
  </body>
</html>
